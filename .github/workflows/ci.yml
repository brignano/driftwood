name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets publish.yml reuse this whole suite as a gate, so a release runs the
  # same graphviz/wasm/drift assertions a PR does rather than a lesser subset.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Graphviz must work from a plain `npm install` with no system package.
  # This is the core promise, so it is asserted rather than assumed.
  bundled-graphviz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert no native Graphviz is present
        run: |
          if command -v dot >/dev/null 2>&1; then
            echo "dot unexpectedly on PATH; this job must run without it"; exit 1
          fi
      - name: Graphviz must still be available, and auto must choose it
        run: |
          npx tsx src/cli.ts engines
          npx tsx src/cli.ts engines | grep -q "auto would use: graphviz"
      - name: Real SVG must render with nothing native installed
        run: |
          npx tsx src/cli.ts render examples/architecture.yaml --view edge --engine graphviz > /tmp/out.svg
          grep -q "<svg" /tmp/out.svg
          grep -q "Generated by graphviz" /tmp/out.svg
      - name: Icons must be drawn, and no marker may survive into the output
        # Icon placement depends on how Graphviz escapes SVG text, so a
        # Graphviz upgrade could silently leave raw markers on the page.
        run: |
          grep -q 'class="driftwood-icon"' /tmp/out.svg
          if grep -q "@@dwicon" /tmp/out.svg; then
            echo "unreplaced icon marker in rendered SVG"; exit 1
          fi

  # ...and where WebAssembly is switched off (hardened runtimes, --jitless),
  # auto must degrade to Mermaid rather than fail.
  wasm-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: auto must fall back to Mermaid when WebAssembly is unavailable
        run: |
          node --jitless dist/cli.js engines
          node --jitless dist/cli.js engines | grep -q "auto would use: mermaid"
      - name: Mermaid must still render under the same conditions
        run: node --jitless dist/cli.js render examples/architecture.yaml --view edge | grep -q "flowchart"

  # The README embeds rendered output. A picture of the tool's own output that
  # no longer matches what the tool produces is worse than no picture, so the
  # committed renders are checked against their source rather than trusted —
  # the drift gate's argument, one level up.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Re-render the example and fail if the committed output is stale
        run: |
          npm run docs
          if [ -n "$(git status --porcelain -- docs/ README.md)" ]; then
            echo "::error::committed renders are out of date — run 'npm run docs' and commit the result"
            git status --short -- docs/ README.md
            git diff --stat -- docs/ README.md
            exit 1
          fi

  # Proves the drift gate works. In a real deployment this would run
  # `terraform show -json` against live state with a read-only role.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile via config (multi-provider path)
        run: npx tsx src/cli.ts reconcile examples/architecture.yaml -c examples/driftwood.config.yaml
      - name: Drift must be detected and must fail the build
        run: |
          if npx tsx src/cli.ts reconcile examples/architecture.yaml \
               --terraform examples/orders-platform.drifted.tfstate.json; then
            echo "expected drift to exit non-zero"; exit 1
          fi

      # The drifted state omits a secret the CI role cannot list, exactly as a
      # read-only observation would. Reporting that as a deletion would invite a
      # pull request deleting a secret nobody deleted, so it is asserted rather
      # than left to the unit tests alone.
      - name: A declared blind spot must never be reported as a deletion
        run: |
          npx tsx src/cli.ts reconcile examples/architecture.yaml \
            --terraform examples/orders-platform.drifted.tfstate.json \
            --exit-zero -o /tmp/drift.md
          removed=$(sed -n '/not found in infrastructure/,/^### /p' /tmp/drift.md)
          # The genuinely deleted bucket must still read as deleted...
          echo "$removed" | grep -q 'aws_s3_bucket.uploads'
          # ...and the unobservable secret must not.
          if echo "$removed" | grep -q 'aws_secretsmanager_secret.db_password'; then
            echo "::error::an entity inside a declared coverage gap was reported as removed"
            cat /tmp/drift.md; exit 1
          fi
          grep -q 'Declared, but not verifiable' /tmp/drift.md

      # A scheduled drift job writes the model back and opens a pull request.
      # If writing the drift did not actually resolve it, that job proposes the
      # same pull request every morning until someone mutes it.
      - name: Writing drift back must resolve it, and must not touch anything else
        run: |
          cp examples/architecture.yaml /tmp/model.yaml
          npx tsx src/cli.ts reconcile /tmp/model.yaml \
            --terraform examples/orders-platform.drifted.tfstate.json \
            --write-model /tmp/model.yaml --exit-zero
          # Converged: reconciling the written model finds nothing.
          npx tsx src/cli.ts reconcile /tmp/model.yaml \
            --terraform examples/orders-platform.drifted.tfstate.json
          # No churn: a converged model is left alone rather than rewritten,
          # so the scheduled job stops proposing changes once it is caught up.
          cp /tmp/model.yaml /tmp/model.once.yaml
          npx tsx src/cli.ts reconcile /tmp/model.yaml \
            --terraform examples/orders-platform.drifted.tfstate.json \
            --write-model /tmp/model.yaml --exit-zero
          diff -u /tmp/model.once.yaml /tmp/model.yaml
          # The comments above the hand-written blocks are the reasoning a
          # reviewer needs most, and a regenerated file would drop all of them.
          grep -q 'Cross-source identity is explicit, never guessed' /tmp/model.yaml
          grep -q 'Declared blind spots' /tmp/model.yaml
          # The blind-spot secret is still there; the deleted bucket is not.
          grep -q 'aws_secretsmanager_secret.db_password' /tmp/model.yaml
          if grep -q 'aws_s3_bucket.uploads' /tmp/model.yaml; then
            echo "::error::a genuinely deleted resource survived the write-back"; exit 1
          fi
          # The written model must still be a valid model.
          npx tsx src/cli.ts validate /tmp/model.yaml

      # Capturing an observation in one place and reconciling it in another is
      # the integration that lets the deploy pipeline and the model live in
      # different repositories, so the whole round trip is asserted, not just
      # its halves.
      - name: An observation must survive the trip between machines
        run: |
          npx tsx src/cli.ts observe \
            --terraform examples/orders-platform.drifted.tfstate.json \
            --model examples/architecture.yaml \
            --origin workspace=ci --origin commit=${{ github.sha }} \
            -o /tmp/observation.json
          # Provenance is what makes a drift PR from another system reviewable.
          grep -q '"workspace": "ci"' /tmp/observation.json
          grep -q '"observedAt"' /tmp/observation.json

          # Paths in a config resolve against the config's own directory, so
          # `observation.json` here means /tmp/observation.json.
          printf '%s\n' \
            'providers:' \
            '  - use: observation' \
            '    with:' \
            '      path: observation.json' \
            '      maxAgeMinutes: 1440' \
            > /tmp/observe.config.yaml

          # Reconciling the artifact must find exactly the drift the state file
          # does — the trip through the envelope changes nothing.
          npx tsx src/cli.ts reconcile examples/architecture.yaml \
            -c /tmp/observe.config.yaml --exit-zero -o /tmp/via-observation.md
          npx tsx src/cli.ts reconcile examples/architecture.yaml \
            --terraform examples/orders-platform.drifted.tfstate.json \
            --exit-zero -o /tmp/direct.md
          diff -u /tmp/direct.md /tmp/via-observation.md

      # The failure mode that makes the push pattern dangerous: the pipeline
      # stops publishing, the consumer keeps reading, and everything deployed
      # since reads as a deletion. Refusing must be loud, not best-effort.
      - name: A stale observation must be refused, not reconciled against
        run: |
          node -e "
            const fs = require('node:fs')
            const o = JSON.parse(fs.readFileSync('/tmp/observation.json', 'utf8'))
            o.observedAt = new Date(Date.now() - 9 * 864e5).toISOString()
            fs.writeFileSync('/tmp/stale.json', JSON.stringify(o))
          "
          sed 's#path: observation.json#path: stale.json#' /tmp/observe.config.yaml > /tmp/stale.config.yaml
          if npx tsx src/cli.ts reconcile examples/architecture.yaml -c /tmp/stale.config.yaml --exit-zero; then
            echo "::error::a stale observation was accepted"; exit 1
          fi
          npx tsx src/cli.ts reconcile examples/architecture.yaml -c /tmp/stale.config.yaml --exit-zero 2>&1 \
            | grep -q "older than the 1440-minute limit"
