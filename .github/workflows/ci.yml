name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Proves the drift gate works against the committed example. In a real
  # deployment this step would run `terraform show -json` against live state
  # with a read-only role instead of reading a fixture.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile model against Terraform state
        run: npx tsx src/cli.ts reconcile examples/architecture.yaml --terraform examples/aws-config.tfstate.json
