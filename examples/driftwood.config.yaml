# driftwood configuration — the plug-and-play surface.
#
# Adding a provider or switching render engines is a config edit, never a code
# change. Run:  driftwood reconcile examples/architecture.yaml -c examples/driftwood.config.yaml

model: architecture.yaml

providers:
  # Declarative source: what infrastructure is *supposed* to exist.
  # Terraform is platform-agnostic — the same provider covers AWS, GCP, Azure,
  # vSphere and on-prem, because the platform is whatever the state declares.
  - use: terraform
    with:
      statePath: ./orders-platform.tfstate.json
      includeDataSources: false

  # Runtime source: what is *actually running*. Commented out because it needs
  # a live environment and a token; uncomment to reconcile intent against
  # reality rather than intent against itself. The `aliases` block in
  # architecture.yaml is what joins its entity ids to the Terraform addresses.
  #
  # - use: dynatrace
  #   with:
  #     url: https://abc12345.live.dynatrace.com
  #     tokenEnv: DYNATRACE_API_TOKEN   # the env var name, never the token
  #     platform: aws
  #     entitySelectors:
  #       - type("SERVICE")
  #       - type("HOST")

render:
  # engine: auto  -> Graphviz if it is available (native binary or the WASM
  #                  package), otherwise Mermaid. Same config works on a
  #                  developer laptop and a locked-down corporate machine.
  - view: context
    to: docs/context.svg
    engine: auto

  # Pin an engine when the output format matters to something downstream.
  # Mermaid renders natively in a GitHub pull request.
  - view: async
    to: docs/async.mmd
    engine: mermaid

  # DOT source needs no engine at all — useful when the machine that builds
  # the docs is not the machine allowed to install anything.
  - view: network
    to: docs/network.dot
    engine: dot
