# Views are a v1 feature, not a later optimization: 45 entities is already too
# many for one readable page, and a real estate is an order of magnitude worse.
# A view scopes by entity id or group, with a trailing `*` wildcard.
views:
  - id: context
    title: The whole platform, one page
    level: context
    include: []
    exclude:
      - aws_iam_*
      - aws_cloudwatch_*
  - id: edge
    title: Edge — DNS, CDN, WAF and the load balancer
    level: container
    include:
      - route53
      - cloudfront
      - acm
      - wafv2
      - lb
    exclude: []
  - id: app
    title: Request path — load balancer to containers
    level: container
    include:
      - lb
      - ecs
    exclude: []
  - id: data
    title: Stateful services
    level: container
    include:
      - db
      - dynamodb
      - elasticache
      - s3
    exclude: []
  - id: async
    title: Order processing — queue, topic and worker
    level: container
    include:
      - sqs
      - sns
      - lambda
    exclude: []
  - id: network
    title: VPC, subnets and security groups
    level: container
    include:
      - vpc
      - subnet
      - security
      - nat
    exclude: []

# Intentional divergence, reviewed like code. Log groups are created and
# retired by the application teams' own pipelines, so their churn is not drift
# anyone needs to see.
ignore:
  entities: []
  kinds:
    - aws_cloudwatch_log_group
  edges: []

# Cross-source identity is explicit, never guessed. Dynatrace calls the orders
# API `SERVICE-4A1B2C3D4E5F6789`; nothing in either payload proves it is the
# same thing as the ECS service, so the mapping is written down and reviewed.
aliases:
  SERVICE-4A1B2C3D4E5F6789: aws_ecs_service.orders_api
  SERVICE-9F8E7D6C5B4A3210: aws_ecs_service.storefront

# Declared blind spots. Read-only credentials never see everything, and
# "unknown" must never be reported as "absent".
coverage:
  - scope: aws_secretsmanager_*
    reason: the read-only role used by CI can list secret names but not versions
  - scope: aws_route53_record.*
    reason: records managed by the marketing team's own zone delegation are invisible here

