# Opens architecture drift as a pull request.
#
# Copy this into `.github/workflows/` in the repository that holds your model
# and adjust the two paths and the credentials step. Every morning it observes
# your infrastructure, writes what it found back into the model, and proposes
# the change for review.
#
# The point is that a human reviews a diff, not that a robot edits the model.
# driftwood only ever reads infrastructure — the write permissions below are
# for this repository, so the job can push a branch and open a pull request.
# The credentials handed to the providers stay read-only.

name: Architecture drift

on:
  schedule:
    # Daily, early. Drift is not an emergency; a morning cadence gives a
    # reviewer one PR to read rather than a stream of them.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @brignano/driftwood

      # Whatever your providers need, read-only. For the AWS example that is a
      # role with a ReadOnlyAccess-shaped policy and nothing more. driftwood
      # never calls a mutating API, so a role that can only read is enough —
      # and is the only kind this tool should ever be handed.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.DRIFTWOOD_READONLY_ROLE }}
      #     aws-region: us-east-1

      - name: Observe, and write what was found back into the model
        run: |
          driftwood reconcile architecture.yaml \
            --config driftwood.config.yaml \
            --write-model architecture.yaml \
            --out /tmp/drift-report.md \
            --exit-zero
        # `--exit-zero` because drift is the expected outcome here, not a
        # failure. The gate that fails on drift belongs on pull requests; this
        # job's job is to propose the fix.

      - name: Propose the change
        uses: peter-evans/create-pull-request@v7
        with:
          # A fixed branch name is load-bearing. The action updates this branch
          # and the open pull request in place, so a week of drift is one
          # evolving PR. A fresh branch per run would open a new PR every
          # morning, and a queue of near-identical PRs is what gets muted.
          branch: driftwood/drift
          add-paths: architecture.yaml
          title: 'Architecture drift detected'
          body-path: /tmp/drift-report.md
          commit-message: |
            chore: reconcile architecture model with observed infrastructure

            Generated by driftwood. The diff is what the providers observed;
            the report in the pull request body says what changed and what
            could not be verified.
          labels: architecture, drift
